# ─────────────────────────────────────────────
#  tmux.conf — Catppuccin Mocha + TPM
# ─────────────────────────────────────────────

# ---- Genel ----
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor (24-bit)
# emacs OSC12 imleç rengi (Cs/Cr) + DECSCUSR imleç şekli (Ss/Se) tmux'tan geçsin
set -ga terminal-overrides ',*:Cs=\E]12;%p1%s\007:Cr=\E]112\007'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'
set -g mouse on                              # fare ile pane/pencere/scroll
set -g set-clipboard on                      # OSC52 yedek (Ghostty destekler)
set -as terminal-features ',*:clipboard'
set -g history-limit 50000
set -g base-index 1                          # pencereler 1'den başlar
setw -g pane-base-index 1
set -g renumber-windows on                   # pencere kapanınca yeniden numarala
set -sg escape-time 10                       # vim ESC gecikmesi yok
set -g focus-events on
setw -g mode-keys vi

# Ghostty gibi panoya yaz/oku (X11: xclip → CLIPBOARD)
# Seçim hem CLIPBOARD hem PRIMARY'ye gider (Ctrl+Shift+V ve orta tık)
set -g copy-command 'xclip -in -selection clipboard'
# shell helper: panodan buffer'a yükle + yapıştır
# (tırnak/özel karakter bozulmasın diye load-buffer -)

# ---- Prefix: Ctrl-a (Ctrl-b yerine) ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- Split: | ve - (mantıklı tuşlar) ----
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- Pane gezinme: prefix + h/j/k/l ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- Pane boyutlandırma: prefix + H/J/K/L (tekrarlı) ----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Config reload ----
bind r source-file ~/.tmux.conf \; display-message "tmux.conf yeniden yüklendi ✓"

# ─────────────────────────────────────────────
#  Copy / paste — Ghostty ile aynı his
#  • Fare sürükle → CLIPBOARD (Ctrl+Shift+V ile yapıştır)
#  • Çift tık = kelime, üç tık = satır
#  • Ctrl+Shift+C kopyala, Ctrl+Shift+V / Shift+Insert / orta tık yapıştır
#  • y / Enter copy-mode içinde de panoya
# ─────────────────────────────────────────────

# --- copy-mode (vi) ---
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi V      send -X select-line
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi Enter  send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi C-c    send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
# tmux tuş adı: Ctrl+Shift+C = S-C-c
bind -T copy-mode-vi S-C-c  send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi Escape send -X cancel
# fare sürükleyip bırakınca panoya + moddan çık (terminal gibi)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
# copy-mode içinde orta tık: panodan yapıştır, moddan çık
bind -T copy-mode-vi MouseDown2Pane send -X cancel \; run-shell 'xclip -o -selection clipboard 2>/dev/null | tmux load-buffer - && tmux paste-buffer -p'

# --- copy-mode (emacs / varsayılan) — bazı eklentiler buraya düşer ---
bind -T copy-mode C-c               send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode S-C-c             send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode MouseDown2Pane    send -X cancel \; run-shell 'xclip -o -selection clipboard 2>/dev/null | tmux load-buffer - && tmux paste-buffer -p'

# --- normal (root): Ghostty kısayolları ---
# Ctrl+Shift+V → sistem panosu (tmux: S-C-v)
bind -T root S-C-v run-shell 'xclip -o -selection clipboard 2>/dev/null | tmux load-buffer - && tmux paste-buffer -p'
# Shift+Insert (tmux: S-IC)
bind -T root S-IC run-shell 'xclip -o -selection clipboard 2>/dev/null | tmux load-buffer - && tmux paste-buffer -p'
# Orta tık yapıştır
bind -T root MouseDown2Pane run-shell 'xclip -o -selection clipboard 2>/dev/null | tmux load-buffer - && tmux paste-buffer -p'

# Çift tık = kelime seç + panoya (mod açık kalsın, terminal gibi görünsün)
bind -T root DoubleClick1Pane \
  select-pane \; \
  copy-mode -M \; \
  send-keys -X select-word \; \
  send-keys -X copy-pipe-no-clear "xclip -in -selection clipboard"
bind -T copy-mode-vi DoubleClick1Pane \
  select-pane \; \
  send-keys -X select-word \; \
  send-keys -X copy-pipe-no-clear "xclip -in -selection clipboard"

# Üç tık = satır seç + panoya
bind -T root TripleClick1Pane \
  select-pane \; \
  copy-mode -M \; \
  send-keys -X select-line \; \
  send-keys -X copy-pipe-no-clear "xclip -in -selection clipboard"
bind -T copy-mode-vi TripleClick1Pane \
  select-pane \; \
  send-keys -X select-line \; \
  send-keys -X copy-pipe-no-clear "xclip -in -selection clipboard"

# prefix + p / P = panodan yapıştır (yedek)
bind p run-shell 'xclip -o -selection clipboard 2>/dev/null | tmux load-buffer - && tmux paste-buffer -p'
bind P paste-buffer

# ─────────────────────────────────────────────
#  Eklentiler (TPM)
# ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'tmux-plugins/tmux-resurrect'   # session kaydet/geri yükle
# set -g @plugin 'tmux-plugins/tmux-continuum'   # otomatik kaydet

# ---- Minimal status (altta) ----
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 40

# İnce görünüm: bar arka planı şeffaf (terminal bg), aktif pencere blok değil renkli yazı
set -g status-left '#[fg=green]▍#S '
set -g status-right '#[fg=brightblack]%H:%M'
setw -g window-status-format ' #[fg=brightblack]#I:#W '
setw -g window-status-current-format ' #[fg=green,bold]#I:#W '
setw -g window-status-separator ''
set -g status-style 'bg=default fg=#7d8fa0'
set -g message-style 'bg=green fg=black'
set -g message-command-style 'bg=green fg=black'

# ---- resurrect / continuum ----
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ─────────────────────────────────────────────
#  TPM başlat
# ─────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'

# TPM/sensible bazı copy bind'larını ezebilir — clipboard kısayollarını
# plugin'lerden SONRA tekrar sabitle (Ghostty parity).
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi S-C-c send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T root S-C-v run-shell 'xclip -o -selection clipboard 2>/dev/null | tmux load-buffer - && tmux paste-buffer -p'
bind -T root S-IC  run-shell 'xclip -o -selection clipboard 2>/dev/null | tmux load-buffer - && tmux paste-buffer -p'
bind -T root MouseDown2Pane run-shell 'xclip -o -selection clipboard 2>/dev/null | tmux load-buffer - && tmux paste-buffer -p'
